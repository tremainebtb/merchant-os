<!doctype html>
<html lang="en-GH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CountMy - your book</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF6EC">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Patrick+Hand&display=swap">
<!--
  CountMy "The Book" prototype (24 Sep 2026). A test, not the app.
  Evidence behind it: 8+ people from Facebook group posts asked "what is it,
  what do I do"; the owner's mum lost two voice attempts to mishearing, then
  tapped seven clean entries; Facebook's Android browser blocks the mic for
  most arrivals. So the first screen IS the exercise book, three picture
  buttons, and the phone keypad every trader already dials MoMo codes on.
  Red team + code review (24 Sep) fixes are in: restore link in the WhatsApp
  copy, part payments that count as money in, no auto-keyboard on "Owes me",
  demo that never touches her data, Clarity masked. Kept ASCII (project rule).
-->
<style>
:root{
  --paper:#FBF6EC; --rule:#CFD9E6; --margin:#E07A6F; --ink:#23262B; --soft:#6B6F76;
  --navy:#1E2F55; --flame:#D9541A;
  --in:#1B7A43; --in-soft:#E1F2E7; --out:#B23A2A; --out-soft:#F8E1DC; --owe:#9A6508; --owe-soft:#FBEFD9;
  --line:44px; --key:52px;
}
@media (max-height:680px){:root{--key:44px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.3 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100vh;max-width:560px;margin:0 auto;position:relative}
@supports (height:100dvh){.app{height:100dvh}}

.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 6px}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--navy);font-size:1.05rem}
.brand svg{width:24px;height:24px}
.brand .my{color:var(--flame)}
.day{margin-left:auto;display:flex;align-items:center;gap:2px}
.day button{width:40px;height:40px;border-radius:50%;font-size:1.6rem;line-height:1;color:var(--navy)}
.day button:disabled{opacity:.25}
.day span{min-width:92px;text-align:center;font-weight:800;color:var(--navy)}
.wa{width:40px;height:40px;border-radius:50%;background:#25D366;display:grid;place-items:center;flex:none}
.wa svg{width:22px;height:22px;fill:#fff}

.sums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:4px 14px 10px}
.sum{min-width:0;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:4px;min-height:48px;text-align:left}
.sum .mk{flex:none;font-weight:800;font-size:1.25rem;width:16px;text-align:center}
.sum b{min-width:0;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .chev{margin-left:auto;flex:none;font-weight:800}
.sum svg{flex:none;width:18px;height:18px}
.s-in{background:var(--in-soft);color:var(--in)} .s-out{background:var(--out-soft);color:var(--out)} .s-owe{background:var(--owe-soft);color:var(--owe)}

.page{flex:1;overflow-y:auto;position:relative;padding:0 0 calc(132px + env(safe-area-inset-bottom,0px));
  background-image:linear-gradient(to right,transparent 52px,var(--margin) 52px,var(--margin) 54px,transparent 54px),linear-gradient(to bottom,transparent calc(var(--line) - 1px),var(--rule) calc(var(--line) - 1px),var(--rule) var(--line));
  background-size:100% 100%,100% var(--line);background-attachment:local,local}
.page-head{height:var(--line);line-height:var(--line);padding-left:64px;font-family:"Patrick Hand","Segoe Print","Bradley Hand",cursive;font-size:1.35rem;color:var(--navy)}
.hint{height:var(--line);line-height:var(--line);margin:0;padding-left:64px;padding-right:12px;font-size:.92rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px;fill:var(--soft)}
ol{list-style:none;margin:0;padding:0}
.ln{height:var(--line);display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;font-family:"Patrick Hand","Segoe Print","Bradley Hand",cursive;font-size:1.45rem;width:100%;text-align:left}
.ln .mk{width:36px;flex:none;text-align:center;font-family:"Manrope",sans-serif;font-weight:800;font-size:1.3rem}
.ln .amt{font-variant-numeric:tabular-nums;min-width:4.5ch;flex:none}
.ln .cs{font-family:"Manrope",system-ui,sans-serif;font-weight:800;font-size:.8em;margin-right:1px}
.ln .txt{color:var(--ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ln .left{font-family:"Manrope",sans-serif;font-size:.8rem;font-weight:700;color:var(--soft);flex:none}
.ln .tag{font-family:"Manrope",sans-serif;font-size:.8rem;font-weight:800;padding:3px 8px;border-radius:99px;flex:none}
.ln .paybtn{font-family:"Manrope",sans-serif;font-size:.9rem;font-weight:800;padding:8px 12px;border-radius:99px;background:var(--in);color:#fff;flex:none}
.ln.in .mk,.ln.in .amt{color:var(--in)} .ln.out .mk,.ln.out .amt{color:var(--out)} .ln.owe .mk,.ln.owe .amt{color:var(--owe)}
.ln.paid .amt,.ln.paid .txt{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.ln.paid .tag{background:var(--in-soft);color:var(--in)}
.ln.gone .amt,.ln.gone .txt,.ln.gone .mk{text-decoration:line-through;opacity:.35}
.ln.ghost{opacity:.35;pointer-events:none}
.ln.new{animation:write .7s ease-out}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

.bar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 78%,rgba(251,246,236,0));z-index:5}
.act{border-radius:18px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-weight:800;font-size:1.02rem;box-shadow:0 3px 10px rgba(30,20,10,.14);transition:transform .12s}
.act svg{width:38px;height:38px}
.a-in{background:var(--in)} .a-out{background:var(--out)} .a-owe{background:var(--owe)}
.act:active,.act.pressed{transform:scale(.94)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 10px rgba(30,20,10,.14),0 0 0 0 rgba(27,122,67,.45)}50%{box-shadow:0 3px 10px rgba(30,20,10,.14),0 0 0 12px rgba(27,122,67,0)}}
.wa.pulse{animation:wapulse 1.6s ease-in-out infinite}
@keyframes wapulse{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}50%{box-shadow:0 0 0 10px rgba(37,211,102,0)}}

.scrim{position:absolute;inset:0;background:rgba(20,18,15,.35);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:100%;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30%)}to{transform:none}}
.sh-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.sh-ico svg{width:26px;height:26px}
.sh-title{font-weight:800;font-size:1.2rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-day{font-weight:700;font-size:.85rem;color:var(--soft);margin-left:4px;flex:none}
.x{margin-left:auto;width:44px;height:44px;border-radius:50%;background:#F1ECE2;font-size:1.5rem;line-height:1;flex:none}
.k-in .sh-ico,.k-pay .sh-ico{background:var(--in)} .k-out .sh-ico{background:var(--out)} .k-owe .sh-ico{background:var(--owe)}
.who{margin-bottom:6px}
.field{width:100%;font:inherit;font-size:1.1rem;padding:11px 14px;border:2px solid #E4DCCB;border-radius:14px;background:#FFFDF8;color:var(--ink)}
.field:focus{outline:none;border-color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:8px 12px;border-radius:99px;background:#F1ECE2;font-weight:600;font-size:.95rem}
.chip.on{background:var(--navy);color:#fff}
.disp{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:2px 0 6px;font-variant-numeric:tabular-nums;border-radius:14px}
.disp .cur{font-size:1.5rem;font-weight:800;color:var(--soft)}
.disp .n{font-size:2.8rem;font-weight:800;letter-spacing:-.02em}
.k-in .disp .n,.k-pay .disp .n{color:var(--in)} .k-out .disp .n{color:var(--out)} .k-owe .disp .n{color:var(--owe)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.key{height:var(--key);border-radius:14px;background:#F4EFE6;font-size:1.55rem;font-weight:800;color:var(--navy)}
.key:active{background:#E6DFD2}
.write{width:100%;height:60px;border-radius:16px;background:var(--in);color:#fff;font-weight:800;font-size:1.25rem;display:flex;align-items:center;justify-content:center;gap:8px}
.write svg{width:26px;height:26px}
.write.dim{opacity:.4}
.extras{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.note{margin-top:8px;font-size:1rem;padding:10px 14px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.wa-say{display:flex;gap:10px;align-items:flex-start;margin:4px 0 6px;font-size:1.05rem;line-height:1.4}
.wa-say svg{flex:none;width:34px;height:34px;fill:var(--navy);opacity:.8}
.menu-btn{display:block;width:100%;min-height:56px;border-radius:14px;margin-top:8px;font-weight:800;font-size:1.1rem;background:#F4EFE6;color:var(--navy)}
.menu-btn.go{background:var(--in);color:#fff}
.debts{max-height:55vh;overflow-y:auto}
.debt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEE7DA}
.debt .nm{flex:1;min-width:0;font-family:"Patrick Hand",cursive;font-size:1.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.debt .am{font-weight:800;color:var(--owe);font-variant-numeric:tabular-nums}
.debt button{padding:10px 14px;border-radius:12px;background:var(--in);color:#fff;font-weight:800}
.empty-debts{color:var(--soft);padding:10px 0}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 116px);transform:translateX(-50%);max-width:calc(100% - 24px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;z-index:30;display:flex;gap:12px;align-items:center}
.toast #toastMsg{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{color:#FFD08A;font-weight:800;flex:none}
.demo-layer{position:absolute;inset:0;z-index:39;background:rgba(20,18,15,.10)}
.finger{position:absolute;z-index:40;width:46px;height:46px;border-radius:50%;background:rgba(30,47,85,.28);border:3px solid rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none;transition:left .6s ease,top .6s ease,transform .12s,opacity .3s}
.finger.tap{transform:scale(.8)}
.myturn{position:absolute;z-index:41;left:12px;right:12px;bottom:calc(122px + env(safe-area-inset-bottom,0px));height:58px;border-radius:16px;background:var(--navy);color:#fff;font-weight:800;font-size:1.2rem}
@media (prefers-reduced-motion:reduce){.pulse,.wa.pulse,.ln.new,.sheet,.shake{animation:none}.finger{transition:none}}
</style>
<script>
  // Owner phones (?owner=1) send nothing - checked from the URL every load too,
  // so it still works where the browser blocks storage.
  window.KYM_IS_OWNER_DEVICE = (function () {
    var fromUrl = false; try { fromUrl = new URLSearchParams(location.search).get('owner') === '1'; } catch (e) {}
    try { if (fromUrl) localStorage.setItem('kym_owner_device', '1'); return fromUrl || localStorage.getItem('kym_owner_device') === '1'; } catch (e) { return fromUrl; }
  })();
  (function(c,l,a,r,i,t,y){
    if (window.KYM_IS_OWNER_DEVICE) return;
    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
  })(window, document, "clarity", "script", "y91blwr2nq");
</script>
</head>
<body>
<script>window.KYM_TRY_VARIANT = 'try-b'; window.KYM_TRY_DEMO = true;</script>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="15" y="9" width="30" height="12" rx="6" fill="#E8641F" transform="rotate(-7 30 15)"/><rect x="10" y="26" width="38" height="12" rx="6" fill="#F2B233"/><rect x="17" y="43" width="32" height="12" rx="6" fill="#1E2F55" transform="rotate(4 33 49)"/></svg><span>Count<span class="my">My</span></span></div>
    <div class="day"><button type="button" id="prevDay" aria-label="Day before">&lsaquo;</button><span id="dayLabel">Today</span><button type="button" id="nextDay" aria-label="Next day">&rsaquo;</button></div>
    <button type="button" class="wa" id="waBtn" aria-label="Keep a copy of my book in my WhatsApp" hidden><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/></svg></button>
  </header>

  <div class="sums" data-clarity-mask="True">
    <div class="sum s-in" aria-label="Money in"><span class="mk">+</span><b id="sumIn">&#8373;0</b></div>
    <div class="sum s-out" aria-label="Money out"><span class="mk">&minus;</span><b id="sumOut">&#8373;0</b></div>
    <button type="button" class="sum s-owe" id="sumOweBtn" aria-label="Who owes me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><b id="sumOwe">&#8373;0</b><span class="chev" aria-hidden="true">&rsaquo;</span></button>
  </div>

  <main class="page" id="page" data-clarity-mask="True">
    <div class="page-head" id="pageHead"></div>
    <p class="hint" id="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 0 1 6 0v3Z"/></svg>No sign up. It stays on your phone.</p>
    <ol id="lines"></ol>
  </main>

  <nav class="bar">
    <button type="button" class="act a-in" id="btnIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Sold</button>
    <button type="button" class="act a-out" id="btnOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 12h14"/></svg>Spent</button>
    <button type="button" class="act a-owe" id="btnOwe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.6"/><path d="M3 20a7 7 0 0 1 14 0"/><path d="M19 7v6M16 10h6"/></svg>Owes me</button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>

  <div class="sheet" id="entrySheet" hidden role="dialog" aria-modal="true" data-clarity-mask="True">
    <div class="sh-top"><span class="sh-ico" id="shIco"></span><span class="sh-title" id="shTitle">Sold</span><span class="sh-day" id="shDay"></span><button type="button" class="x" id="shClose" aria-label="Close">&times;</button></div>
    <div class="who" id="whoBox" hidden>
      <input class="field" id="whoIn" type="text" maxlength="30" placeholder="Who?" autocomplete="off" enterkeyhint="done" aria-label="Who owes you">
      <div class="chips" id="whoChips"></div>
    </div>
    <div class="disp" id="disp"><span class="cur">&#8373;</span><span class="n" id="amtOut">0</span></div>
    <div class="keys" id="keys"></div>
    <button type="button" class="write dim" id="writeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Write it</button>
    <div class="extras" id="extras"><span id="catChips" class="chips" style="margin:0;justify-content:center"></span><button type="button" class="chip" id="wordsBtn">+ words</button></div>
    <input class="field note" id="noteIn" type="text" maxlength="40" placeholder="What was it?" autocomplete="off" enterkeyhint="done" aria-label="What was it" hidden>
  </div>

  <div class="sheet" id="lineSheet" hidden role="dialog" aria-modal="true" data-clarity-mask="True">
    <div class="sh-top"><span class="sh-title" id="lineTitle"></span><button type="button" class="x" id="lineClose" aria-label="Close">&times;</button></div>
    <button type="button" class="menu-btn go" id="linePaid">Paid</button>
    <button type="button" class="menu-btn" id="lineCross">Cross it out</button>
  </div>

  <div class="sheet" id="debtSheet" hidden role="dialog" aria-modal="true" data-clarity-mask="True">
    <div class="sh-top"><span class="sh-ico" style="background:var(--owe)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><span class="sh-title">Who owes me</span><button type="button" class="x" id="debtClose" aria-label="Close">&times;</button></div>
    <div class="debts" id="debtList"></div>
  </div>

  <div class="sheet" id="waSheet" hidden role="dialog" aria-modal="true">
    <div class="sh-top"><span class="sh-ico" style="background:#25D366"><svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg></span><span class="sh-title">Keep a copy</span><button type="button" class="x" id="waClose" aria-label="Close">&times;</button></div>
    <p class="wa-say"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg>Send it to yourself. In WhatsApp, pick your own name - it says <b>(You)</b>.</p>
    <button type="button" class="menu-btn go" id="waGo">Send to myself</button>
  </div>

  <div class="sheet" id="askSheet" hidden role="dialog" aria-modal="true">
    <div class="sh-top"><span class="sh-title" id="askTitle"></span></div>
    <button type="button" class="menu-btn go" id="askYes"></button>
    <button type="button" class="menu-btn" id="askNo"></button>
  </div>

  <div class="toast" id="toast" hidden data-clarity-mask="True"><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>
</div>

<script>
(function () {
  'use strict';
  var VARIANT = window.KYM_TRY_VARIANT || 'try-a';
  var KEY = 'kym_book_v1';
  var API = 'https://countmy-api.boatengbobby.workers.dev';
  var CED = String.fromCharCode(0x20B5), MINUS = String.fromCharCode(0x2212);
  var $ = function (id) { return document.getElementById(id); };
  var demoRunning = false;
  function clip(s, n) { return Array.from(String(s || '')).slice(0, n).join(''); }

  // ---- storage ---------------------------------------------------------------
  var canStore = (function () { try { localStorage.setItem('kym_probe', '1'); localStorage.removeItem('kym_probe'); return true; } catch (e) { return false; } })();
  function load() { if (!canStore) return { entries: [] }; try { var d = JSON.parse(localStorage.getItem(KEY) || '{}'); return Array.isArray(d.entries) ? d : { entries: [] }; } catch (e) { return { entries: [] }; } }
  var book = load();
  function save() { if (!canStore) return; try { localStorage.setItem(KEY, JSON.stringify(book)); } catch (e) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function money(n) {

  function tick(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // ---- wiring ------------------------------------------------------------------
  $('btnIn').addEventListener('click', function () { openEntry('in'); });
  $('btnOut').addEventListener('click', function () { openEntry('out'); });
  $('btnOwe').addEventListener('click', function () { openEntry('owe'); });
  $('writeBtn').addEventListener('click', write);
  $('whoIn').addEventListener('input', refreshEntry);
  $('whoIn').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); $('whoIn').blur(); } });
  $('noteIn').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); $('noteIn').blur(); } });
  $('wordsBtn').addEventListener('click', function () { $('noteIn').hidden = false; $('wordsBtn').hidden = true; $('noteIn').focus(); });
  $('shClose').addEventListener('click', closeSheets);
  $('lineClose').addEventListener('click', closeSheets);
  $('debtClose').addEventListener('click', closeSheets);
  $('scrim').addEventListener('click', function () { pendingRestore = null; closeSheets(); });
  $('waClose').addEventListener('click', closeSheets);
  $('waGo').addEventListener('click', sendWhatsApp);
  $('askYes').addEventListener('click', acceptRestore);
  $('askNo').addEventListener('click', function () { pendingRestore = null; closeSheets(); });
  $('sumOweBtn').addEventListener('click', openDebts);
  $('waBtn').addEventListener('click', openWaSheet);
  $('prevDay').addEventListener('click', function () { hideToast(); viewDay = shiftDay(viewDay, -1); render(); });
  $('nextDay').addEventListener('click', function () { hideToast(); if (viewDay !== today) { viewDay = shiftDay(viewDay, 1); render(); } });

  // ---- variant B: shows itself once. Never opens a sheet, never writes her data,
  // ends on the same faint example line A shows, any touch hands over at once.
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function runDemo() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!window.KYM_TRY_DEMO || reduce || book.entries.length || pendingRestore) return;
    try { if (localStorage.getItem('kym_try_demo_seen') === '1') return; localStorage.setItem('kym_try_demo_seen', '1'); } catch (e) { return; }
    demoRunning = true; render();
    var app = $('app');
    var layer = document.createElement('div'); layer.className = 'demo-layer';
    var f = document.createElement('div'); f.className = 'finger';
    var go = document.createElement('button'); go.type = 'button'; go.className = 'myturn'; go.textContent = 'My turn';
    app.appendChild(layer); app.appendChild(f); app.appendChild(go);
    var stopped = false;
    function stop() {
      if (stopped) return; stopped = true; demoRunning = false;
      layer.remove(); f.remove(); go.remove(); $('btnIn').classList.remove('pressed');
      render();
    }
    // Her tap is never wasted: end the demo and hand the same tap to whatever
    // she pressed underneath (click, not pointerdown, so it can't fire twice).
    layer.addEventListener('click', function (ev) {
      cev('demo_skip'); stop();
      var el = document.elementFromPoint(ev.clientX, ev.clientY), btn = el && el.closest ? el.closest('button,[role="button"]') : null;
      if (btn) btn.click();
    });
    go.addEventListener('click', function () { cev('demo_myturn'); stop(); });
    function at(el) { var a = app.getBoundingClientRect(), r = el.getBoundingClientRect(); f.style.left = (r.left - a.left + r.width / 2 - 23) + 'px'; f.style.top = (r.top - a.top + r.height / 2 - 23) + 'px'; }
    at($('btnOwe')); f.style.top = (parseFloat(f.style.top) - 120) + 'px';
    sleep(800)
      .then(function () { if (!stopped) { at($('btnIn')); return sleep(700); } })
      .then(function () { if (!stopped) { f.classList.add('tap'); $('btnIn').classList.add('pressed'); tick(15); return sleep(220); } })
      .then(function () { if (!stopped) { f.classList.remove('tap'); $('btnIn').classList.remove('pressed'); $('lines').innerHTML = ''; $('lines').appendChild(lineEl({ id: 'ghost', kind: 'in', amt: 60, note: 'waakye' }, true, true)); var gl = $('lines').querySelector('.ln'); if (gl) gl.style.opacity = '.9'; return sleep(1800); } })
      .then(function () { if (!stopped) { var gl = $('lines').querySelector('.ln'); if (gl) gl.style.opacity = ''; f.style.opacity = '0'; return sleep(1200); } })
      .then(function () { stop(); });
  }

  restoreFromLink();
  ping('open');
  render();
  runDemo();
})();
</script>
