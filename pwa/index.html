<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Know Your Money</title>
<meta name="theme-color" content="#0F6A3D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#F7F4EE; --surface:#FFFFFF; --ink:#1D2420; --ink-soft:#57604F; --muted:#8A9080;
  --rule:#E2DDCE; --green:#0F6A3D; --green-deep:#0B4E2C; --green-soft:#E3F1E8;
  --red:#B3401E; --red-soft:#FBE6DC; --amber:#9C6B12; --amber-soft:#FBEFD9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.1rem;font-weight:800;margin:8px 0 16px}
.today{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;margin-bottom:16px}
.today-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:12px}
.today-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.today-row span:first-child{color:var(--ink-soft);font-size:.92rem}
.today-row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.today-row.balance{border-top:1px solid var(--rule);margin-top:6px;padding-top:12px}
.today-row.balance span:first-child{color:var(--ink);font-weight:700}
.today-row.balance span:last-child{font-size:1.3rem;color:var(--green-deep)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.act-btn{border:none;border-radius:14px;padding:16px 10px;font-weight:700;font-size:.92rem;cursor:pointer;text-align:left;color:#fff}
.act-btn small{display:block;font-weight:500;font-size:.72rem;opacity:.85;margin-top:2px}
.act-sale{background:var(--green)}
.act-expense{background:var(--red)}
.act-owe-me{background:var(--amber)}
.act-owe-supplier{background:#5C5347}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;margin-bottom:20px;display:none}
.sheet.open{display:block}
.sheet h2{font-size:1rem;margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.82rem;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
.field input{width:100%;padding:12px;border:1px solid var(--rule);border-radius:10px;font-size:1rem;background:var(--paper)}
.confirm-line{background:var(--green-soft);color:var(--green-deep);border-radius:10px;padding:12px;font-size:.92rem;margin-bottom:14px;font-weight:600;display:none}
.confirm-line.show{display:block}
.mic-btn{width:100%;border:1px dashed var(--rule);background:var(--paper);color:var(--ink-soft);border-radius:10px;padding:11px;font-weight:700;font-size:.88rem;margin-bottom:10px;cursor:pointer}
.mic-btn.listening{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);border-style:solid}
.heard-line{display:none;background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:.84rem;margin-bottom:12px}
.heard-line.show{display:block}
.sheet-btns{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:10px;border:none;font-weight:700;font-size:.94rem;cursor:pointer}
.btn-save{background:var(--green);color:#fff}
.btn-cancel{background:var(--rule);color:var(--ink)}
.hist-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:20px 0 10px}
.hist-item{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--rule);font-size:.9rem}
.hist-item .desc{color:var(--ink)}
.hist-item .desc small{display:block;color:var(--muted);font-size:.76rem}
.hist-item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.pos{color:var(--green-deep)}
.amt.neg{color:var(--red)}
.empty{color:var(--muted);font-size:.88rem;text-align:center;padding:24px 0}
.offline-badge{display:none;background:var(--amber-soft);color:var(--amber);font-size:.78rem;font-weight:700;padding:8px 12px;border-radius:10px;margin-bottom:14px}
.offline-badge.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div id="offlineBadge" class="offline-badge">No connection — still recording, saved on your phone.</div>
  <h1>Know Your Money</h1>

  <div class="today">
    <div class="today-label">Today</div>
    <div class="today-row"><span>Sales</span><span id="tSales">GHS 0</span></div>
    <div class="today-row"><span>Expenses</span><span id="tExpenses">GHS 0</span></div>
    <div class="today-row"><span>Customers owe me</span><span id="tOwedMe">GHS 0</span></div>
    <div class="today-row balance"><span>Balance</span><span id="tBalance">GHS 0</span></div>
  </div>

  <div class="actions">
    <button class="act-btn act-sale" data-type="sale">+ Sale<small>Item, qty, price</small></button>
    <button class="act-btn act-expense" data-type="expense">+ Expense<small>What you spent</small></button>
    <button class="act-btn act-owe-me" data-type="debt_in">Customer owes me<small>Track who owes you</small></button>
    <button class="act-btn act-owe-supplier" data-type="debt_out">I owe supplier<small>Track what you owe</small></button>
  </div>

  <div id="sheet" class="sheet">
    <h2 id="sheetTitle">Add</h2>
    <button id="micBtn" class="mic-btn">🎤 Speak instead</button>
    <div id="heardLine" class="heard-line"></div>
    <div id="fields"></div>
    <div id="confirmLine" class="confirm-line"></div>
    <div class="sheet-btns">
      <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn btn-save" id="saveBtn">Save</button>
    </div>
  </div>

  <div class="hist-label">Recent</div>
  <div id="history"><div class="empty">Nothing recorded yet. Add your first sale above.</div></div>
</div>
<script src="app.js"></script>
</body>
</html>
