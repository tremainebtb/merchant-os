# Deployed via Cloudflare Workers Builds on push to main.
name = "countmy-api"
main = "worker/worker.js"
compatibility_date = "2026-08-27"

# The API's address stays on workers.dev. Wrangler DISABLES workers.dev by
# default the moment any route/custom domain is configured - that took the
# API down for twelve minutes on 15 Sep (Cloudflare error 1042). Explicit.
workers_dev = true

# Short public address for shop pages. countmy.app's DNS is on this Cloudflare
# account (apex stays on GitHub Pages); a Workers custom domain creates the
# b.countmy.app record itself on deploy.
routes = [
  { pattern = "b.countmy.app", custom_domain = true }
]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "COUNTMY_STATUS"
id = "453b08cd0db84e9e946d94e066f91f88"

[[d1_databases]]
binding = "COUNTMY_DB"
database_name = "countmy-db"
database_id = "73ec3c6d-1ed0-4a83-b909-da4413946855"

# Per-IP abuse limits (see the comment block at the top of worker/worker.js).
# Must match worker/deploy.sh. Workers Rate Limiting binding: atomic, free
# plan, no KV writes. Period may only be 10 or 60 seconds.
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
