<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CountMy share card</title>
<!--
  Source for og-image.png (the picture WhatsApp/Facebook show under a
  countmy.app link). Rendered at 1200x630 with headless Chrome:
    chrome --headless --window-size=1200,630 --screenshot=og-image.png tools/og-card.html
  24 Sep 2026: the old card showed the retired "Tell CountMy" screen, and
  people who got the link still asked "explain how it works". This one shows
  the Book as it really is and the three steps, in text big enough to read
  inside a WhatsApp preview.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Patrick+Hand&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#F8F3EC;font-family:Manrope,system-ui,sans-serif;color:#221A12;display:flex;padding:48px 56px;gap:40px}
.left{flex:1;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:40px;color:#1E2F55}
.brand svg{width:48px;height:48px}.brand .my{color:#D9541A}
h1{font-size:58px;line-height:1.05;font-weight:800;color:#1E2F55;margin:26px 0 26px;letter-spacing:-.02em}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700;color:#221A12}
.n{width:44px;height:44px;border-radius:50%;background:#1E2F55;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.foot{margin-top:auto;display:flex;gap:10px;align-items:center;flex-wrap:nowrap;white-space:nowrap;font-size:22px;font-weight:700;color:#5C5142}
.foot b{color:#1E2F55;font-size:28px;margin-right:8px}
.pill{background:#fff;border:2px solid #E7DDCD;border-radius:99px;padding:6px 14px;white-space:nowrap}
.phone{width:340px;height:534px;align-self:center;border:10px solid #221A12;border-radius:42px;background:#F8F3EC;padding:18px 14px;display:flex;flex-direction:column;gap:10px;flex:none;margin-top:-8px}
.page{background:#FFFDF7;border:1px solid #E7DDCD;border-radius:14px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:2px solid #D3DDEA;font-weight:800;color:#1E2F55;font-size:17px}
.owe{background:#FBEFD9;color:#8C5F0F;border-radius:99px;padding:3px 10px;font-size:15px}
.ln{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px 0 6px;font-family:"Patrick Hand",cursive;font-size:22px;border-bottom:1px solid #D3DDEA;background:linear-gradient(to right,transparent 38px,#E3857A 38px,#E3857A 40px,transparent 40px)}
.ln .m{width:26px;text-align:center;font-family:Manrope;font-weight:800;display:flex;justify-content:center}
.cs{font-family:Manrope,system-ui,sans-serif;font-weight:800;font-size:.8em}
.in{color:#1B7A43}.out{color:#A83F2E}.ow{color:#8C5F0F}
.ln .t{color:#221A12;opacity:.85}
.pay{margin-left:auto;background:#1B7A43;color:#fff;font-family:Manrope;font-size:13px;font-weight:800;border-radius:99px;padding:4px 10px}
.sums{display:flex;justify-content:space-between;padding:8px 12px;font-weight:800;font-size:18px}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.b{border-radius:14px;height:104px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:15px}
.b svg{width:38px;height:38px}
.s{background:#1B7A43}.p{background:#A83F2E}.o{background:#8C5F0F}
.talk{background:#2F6DB5;color:#fff;border-radius:14px;height:64px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:18px}
.talk svg{width:26px;height:26px}
</style>
</head>
<body>
<div class="left">
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="15" y="9" width="30" height="12" rx="6" fill="#E8641F" transform="rotate(-7 30 15)"/><rect x="10" y="26" width="38" height="12" rx="6" fill="#F2B233"/><rect x="17" y="43" width="32" height="12" rx="6" fill="#1E2F55" transform="rotate(4 33 49)"/></svg><span>Count<span class="my">My</span></span></div>
  <h1>A free notebook for your business.</h1>
  <div class="steps">
    <div class="step"><span class="n">1</span>Tap Sold, Spent or Owes me</div>
    <div class="step"><span class="n">2</span>Type the amount &mdash; or just talk</div>
    <div class="step"><span class="n">3</span>It adds up your day</div>
  </div>
  <div class="foot"><b>countmy.app</b><span class="pill">Free</span><span class="pill">No signup</span><span class="pill">English &middot; Twi &middot; Pidgin</span></div>
</div>
<div class="phone">
  <div class="page">
    <div class="ph"><span>&lsaquo; Today &rsaquo;</span><span class="owe">&#8373;120 &rsaquo;</span></div>
    <div class="ln in"><span class="m">+</span><span><span class="cs">&#8373;</span>60</span><span class="t">3 waakye</span></div>
    <div class="ln out"><span class="m">&minus;</span><span><span class="cs">&#8373;</span>15</span><span class="t">transport</span></div>
    <div class="ln ow"><span class="m"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8C5F0F" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><span><span class="cs">&#8373;</span>120</span><span class="t">Ama</span><span class="pay">Paid</span></div>
    <div class="ln in"><span class="m">+</span><span><span class="cs">&#8373;</span>40</span><span class="t">kenkey</span></div>
    <div class="sums"><span class="in">+&#8373;100</span><span class="out">&minus;&#8373;15</span><span style="color:#1E2F55">= &#8373;85</span></div>
  </div>
  <div class="bar">
    <div class="b s"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></svg>Sold</div>
    <div class="b p"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="15" height="10" rx="2"/><circle cx="9.5" cy="14" r="2.3"/><path d="M15 8l6-6"/><path d="M16 2h5v5"/></svg>Spent</div>
    <div class="b o"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3.3"/><path d="M2 20.5a6 6 0 0 1 12 0"/><rect x="15.5" y="8.5" width="6.5" height="12" rx="1"/><path d="M17.5 12h2.5M17.5 15h2.5"/></svg>Owes me</div>
  </div>
  <div class="talk"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="#fff" stroke-width="2"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>Talk</div>
</div>
</body>
</html>
