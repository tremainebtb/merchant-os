<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CountMy card</title>
<!-- A printable card to leave by the till. Real reason it exists (5 Sep):
     the one Ghana study on this exact question - 160 Accra tailors - found
     that better practice from in-person help was gone a year after the
     help stopped. This audience learns by watching once, then needs a
     reminder that does not require reading or a phone. Four pictures,
     a dozen words, one page. Print it, fold it, put it where she can see it.
     Deliberately no prices, no features, no URL a person must type - only
     what to do, in order. -->
<style>
  :root{--ink:#221A12;--flame:#D9541A;--leaf:#1B7A43;--paper:#fff;--rule:#E7DDCD;--muted:#8C8172}
  *{box-sizing:border-box}
  body{margin:0;background:#EEE9E1;font-family:"Manrope","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  .card{background:var(--paper);width:148mm;min-height:210mm;margin:16px auto;padding:14mm 12mm;display:flex;flex-direction:column;gap:7mm;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  h1{font-size:14mm;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1}
  .step{display:grid;grid-template-columns:30mm 1fr;gap:6mm;align-items:center}
  .pic{width:30mm;height:30mm;border-radius:8mm;display:flex;align-items:center;justify-content:center}
  .pic svg{width:22mm;height:22mm}
  .p1{background:var(--flame)}
  .p2{background:#FBE3D2}
  .p3{background:var(--leaf)}
  .num{font-size:8mm;font-weight:800;color:var(--muted);line-height:1}
  .say{font-size:8.5mm;font-weight:800;line-height:1.1;margin-top:2mm}
  .eg{font-size:5.4mm;color:var(--muted);margin-top:2mm;line-height:1.25}
  .foot{margin-top:auto;border-top:1px solid var(--rule);padding-top:5mm;font-size:5mm;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .foot b{color:var(--ink);font-size:6mm}
  .print-btn{display:block;margin:0 auto 24px;font:700 16px "Manrope",sans-serif;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:12px 22px;cursor:pointer}
  @media print{body{background:#fff}.card{box-shadow:none;margin:0;width:auto;min-height:auto;page-break-inside:avoid}.print-btn{display:none}@page{size:A5;margin:0}}
</style>
</head>
<body>
<button class="print-btn" onclick="window.print()">Print this card</button>
<div class="card">
  <h1>CountMy</h1>

  <div class="step">
    <div class="pic p1"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="#fff" stroke-width="2"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div><div class="num">1</div><div class="say">Tap the big orange button</div></div>
  </div>

  <div class="step">
    <div class="pic p2"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V16A2.5 2.5 0 0 1 4 13.5v-7Z" stroke="#A83F12" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="#A83F12" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div><div class="num">2</div><div class="say">Say what happened</div>
      <div class="eg">"I sold 3 bags of rice for 30 cedis"<br>"Ama owes me 120 cedis"<br>"I spent 35 cedis on transport"</div></div>
  </div>

  <div class="step">
    <div class="pic p1"><svg viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="#fff"/></svg></div>
    <div><div class="num">3</div><div class="say">Tap it again to stop</div></div>
  </div>

  <div class="step">
    <div class="pic p3"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><div class="num">4</div><div class="say">Listen to what it says</div>
      <div class="eg">"Saved" and wrong? Tap Undo.<br>Asks for something? Tap it in.</div></div>
  </div>

  <div class="foot"><span>Twi, English or Pidgin</span><b>Free</b></div>
</div>
</body>
</html>
